<title id="t">Niko Trouhtchev. building an AI receptionist that answers in Bulgarian. 3,400+ tests behind one phone number. snapping Mac windows with two fingers. teaching a blank YOLOv8 to see, live. WireGuard in the menu bar, in ~2,900 lines of Rust. shipping credit lines for SMEs at Monexo.</title>
